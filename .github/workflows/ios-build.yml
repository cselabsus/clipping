name: iOS build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode 27 SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version | grep -E '^27\.'
      - name: Test highlight boundaries
        run: |
          swiftc ClipThing/HighlightPlan.swift Tests/HighlightPlanTests.swift -o "$RUNNER_TEMP/highlight-tests"
          "$RUNNER_TEMP/highlight-tests"
      - name: Build for iPhone
        run: |
          xcodebuild -project ClipThing.xcodeproj -scheme ClipThing -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/ClipThingBuild" \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/build.log" 2>&1 || { tail -150 "$RUNNER_TEMP/build.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/build.log"
      - name: Verify model removal
        run: |
          python3 - <<'PY'
          import os, pathlib
          app = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ClipThingBuild/Build/Products/Release-iphoneos/ClipThing.app'
          assert app.is_dir(), 'Built app missing'
          forbidden = [p for p in app.rglob('*') if p.suffix == '.safetensors' or p.name in ('SmolVLM2', 'mlx-swift_Cmlx.bundle')]
          assert not forbidden, f'Unexpected model resources: {forbidden}'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-log
          path: ${{ runner.temp }}/build.log
